<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Star Lab</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css?v=10"></head><body><main>
<header><a href="./" class="brand">Star Lab</a><button id="reset" disabled>Reset</button></header>
<section class="diagram"><h1>Hertzsprung–Russell diagram</h1><canvas id="hr" aria-label="Luminosity versus temperature"></canvas></section>
<section class="measurements" aria-label="Light measurements"><div id="controls"></div>
<div class="diagnostic-switches"><button id="seismicToggle" aria-pressed="false" aria-controls="seismicControls" disabled>Brightness oscillations</button><button id="tcToggle" aria-pressed="false" aria-controls="tcControls" disabled>Technetium spectrum</button></div>
<div id="seismicControls" hidden></div><div id="tcControls" hidden></div></section>
<section class="estimate"><h2>Evolutionary evidence</h2><div id="loading" role="status">Loading evidence…</div><h3 id="verdict" aria-live="polite">Stage not determined</h3><div class="coverage" id="evidenceNote"></div><div id="tcResult" aria-live="polite" hidden></div><div class="coverage">Diagnostic estimates · not a joint stellar fit</div></section>
<section class="scene"><canvas id="star" aria-label="Illustrative star based on temperature and luminosity, compared with the Sun"></canvas><div class="scene-top" id="tempBadge"></div><div class="scene-bottom"><select id="sizeMode" aria-label="Radius scale"><option value="compressed">Compressed radii</option><option value="linear">True radius ratio</option></select><button id="pause" aria-pressed="false">Pause</button></div></section>
<div class="readings"><div><span>Inferred radius</span><strong id="radius">—</strong></div></div>
<footer><a href="details.html?v=10">Evidence and sources</a><span>Illustrative animation</span></footer>
</main><script type="module" src="app.js?v=10"></script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Star Lab</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css?v=26"><link rel="stylesheet" href="workspace.css?v=26"></head><body><main>
<header><a href="./" class="brand">Star Lab</a><div class="header-actions"><button id="randomExample" disabled>Random example</button><button id="reset" disabled aria-label="Reset measurements">Reset</button></div></header>
<section id="observedPanel" class="estimate" hidden><h2 id="observedName"></h2><p id="observedReference"></p><strong id="observedComparison" role="status"></strong><details><summary>Recorded measurements</summary><div id="observedMeasurements"></div><p id="observedCaution"></p><a id="sampleAuditLink" href="audit.html" hidden>Sample audit</a></details></section>

<nav class="view-tabs" aria-label="Workspace"><button id="measureTab" aria-pressed="true">1 · Measurements</button><button id="resultTab" aria-pressed="false">2 · Results</button></nav>
<button id="fitSummary" class="fit-summary" aria-label="View overall relative fit">Loading models…</button>
<div class="workspace"><div id="measurePane" class="workspace-pane">
<section class="diagram"><h1>Hertzsprung–Russell diagram</h1><canvas id="hr" aria-label="Luminosity versus temperature"></canvas></section>
<section class="measurements" aria-label="Light measurements"><div id="controls"></div>
<div id="diagnosticOptions" hidden><h2 id="guidanceTitle">Add a measurement</h2><p id="guidanceText"></p><div class="diagnostic-switches"><button id="noneChoice">Temperature + luminosity only</button><button id="lithiumChoice">Lithium</button><button id="spectrumChoice">Magnesium</button><button id="seismicChoice">Oscillations</button></div></div>
<div id="lithiumPanel" hidden><div id="lithiumControls"></div></div>
<div id="spectrumPanel" hidden><div id="spectrumControls"></div></div>
<div id="seismicPanel" hidden><div id="seismicControls"></div></div>
<div id="tcControls" hidden></div><p id="actionNote" role="status"></p></section>
</div><div id="resultPane" class="workspace-pane"><section class="estimate" id="results"><div id="loading" role="status">Loading model candidates…</div><h2 id="verdict" aria-live="polite">Possible stages</h2><details class="fit-details"><summary>Fit details</summary><p id="evidenceNote"></p></details><div id="candidateList"></div><p id="selectionNote"></p></section><section class="scene" id="preview" hidden><canvas id="star" aria-label="Illustrative star based on temperature and luminosity, compared with the Sun"></canvas><div class="scene-top" id="tempBadge"></div><a class="scene-label" id="starStage" href="#verdict">Checking stages</a><div class="scene-bottom"><select id="sizeMode" aria-label="Radius scale"><option value="compressed">Compressed radii</option><option value="linear">True radius ratio</option></select><button id="pause" aria-pressed="false">Pause</button></div></section><div id="readings" class="readings" hidden><div><span>Radius</span><strong id="radius"></strong></div><div><span>Selected model</span><strong id="selectedMass"></strong></div></div></div></div>

<footer><details><summary>Details &amp; sources</summary><a href="examples.html">Sample coverage</a> · <a href="audit.html">Sample audit</a> · <a href="details.html?v=25">Evidence and sources</a><span>Illustrative animation</span></details></footer>
</main><script type="module" src="app.js?v=26"></script></body></html>
